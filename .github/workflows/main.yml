name: RDP

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: 'Tailscale Auth Key (optional if TAILSCALE_AUTH_KEY is set in repo secrets)'
        required: false
        default: ''

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and configure security
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Firewall configuration
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)      # A-Z
              Lower   = [char[]](97..122)     # a-z
              Number  = [char[]](48..57)      # 0-9
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)) # Special characters
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          Write-Host "Created user RDP successfully."

      - name: Install Tailscale
        run: |
          Write-Host "Installing Tailscale via Chocolatey..."
          choco install tailscale -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
              Write-Error "Tailscale binary not found at $tsPath"
              exit 1
          }
          Write-Host "Tailscale installed successfully."

      - name: Establish Tailscale Connection
        env:
          TS_INPUT_KEY: ${{ github.event.inputs.tailscale_key }}
          TS_SECRET_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $authKey = $env:TS_INPUT_KEY
          if (-not $authKey) {
              $authKey = $env:TS_SECRET_KEY
          }
          if (-not $authKey) {
              Write-Error "CRITICAL: Tailscale Auth Key is missing! Please provide it in the 'Run workflow' box or add secret 'TAILSCALE_AUTH_KEY' in repository settings."
              exit 1
          }

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          & $tsPath up --authkey=$authKey --hostname="gh-runner-$env:GITHUB_RUN_ID"
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = (& $tsPath ip -4).Trim()
              if ($tsIP) { break }
              Start-Sleep -Seconds 4
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP assigned: $tsIP"
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Warning "TCP test to Tailscale IP timed out, checking localhost..."
              $localTest = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389
              if (-not $localTest.TcpTestSucceeded) {
                  Write-Error "TCP connection to RDP port 3389 failed"
                  exit 1
              }
          }
          Write-Host "TCP connectivity verified!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=========================================="
          Write-Host "             RDP CREDENTIALS              "
          Write-Host "=========================================="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASS"
          Write-Host "==========================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP Active - Runner is running..."
              Start-Sleep -Seconds 300
          }
